[package]
name = "aurorabr"
version = "1.0.0"
description = "AuroraBR — análise de logs e rastreamento de shaders para recompilação de jogos"
authors = ["AuroraBR Team"]
edition = "2021"

[lib]
name = "aurorabr_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
