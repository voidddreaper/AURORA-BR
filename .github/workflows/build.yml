name: Build & Test (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npx tauri build

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii SHA256SUMS-ci.txt
          Get-Content SHA256SUMS-ci.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraBR-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS-ci.txt
