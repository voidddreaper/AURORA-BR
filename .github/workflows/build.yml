name: Build & Test (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versão para publicar como Release (ex.: v1.0.0). Deixe vazio só para compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npx tauri build

      - name: Package release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, portable/AuroraBR_portable/exemplos | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/aurorabr.exe portable/AuroraBR_portable/
          if (Test-Path src-tauri/target/release/WebView2Loader.dll) { Copy-Item src-tauri/target/release/WebView2Loader.dll portable/AuroraBR_portable/ }
          Copy-Item exemplos/* portable/AuroraBR_portable/exemplos/
          Copy-Item README.md portable/AuroraBR_portable/
          Compress-Archive -Path portable/AuroraBR_portable -DestinationPath out/AuroraBR_portable.zip -Force
          $sums = @(Get-ChildItem out -File) | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $sums | Out-File -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraBR-windows
          path: out/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AuroraBR ${{ inputs.release_tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: out/*
